[workspace]
members = ["crates/ghdash"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Jeremiah Russell <jrussell@jerus.ie>"]
rust-version = "1.88"
repository = "https://github.com/jerusdp/ghdash"

[workspace.dependencies]
anyhow = "1.0.103"
bollard = "0.21.0"
clap = { version = "4.6.1", features = ["derive", "cargo"] }
clap-verbosity-flag = "3.0.4"
comfy-table = "7.2.2"
confy = "2.0.0"
log = "0.4.33"
opentelemetry = "0.31.0"
opentelemetry-zipkin = { version = "0.31.0", features = [
    "reqwest-client",
], default-features = false }
opentelemetry_sdk = { version = "0.31.0", features = ["tokio", "rt-tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }
octocrate = { version = "2.2.0", features = [
    "pulls",
    "issues",
    "repos",
    "apps",
] }
futures-util = "0.3.32"
reqwest = "0.13.3"
trycmd = "1.2.0"

[workspace.lints.clippy]
uninlined-format-args = "warn"
